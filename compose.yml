services:
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    container_name: llamacpp
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - /var/home/admin/llama/models:/models:Z
    environment:
      - LD_LIBRARY_PATH=/app
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri/card0:/dev/dri/card0
      - /dev/dri/renderD128:/dev/dri/renderD128
    privileged: false
    restart: always
    networks:
      - private
    command: >
      --models-dir /models/
      --models-max 1
      --models-preset /models/config.ini
      --port 8081
      --host 0.0.0.0
      --parallel 1
      --cache-ram 16384
      --cache-reuse 256
      -b 4096
      -ub 512
      -t 8
      -fa on
      -np 1
      --api-key

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    privileged: false
    labels:
      - "io.containers.autoupdate=registry"
    ports:
      - "0.0.0.0:3000:8080"
    volumes:
      - /home/nux/data/open-webui:/app/backend/data:Z
    environment:
      - OPENAI_API_BASE_URL=http://llamacpp:8081/v1
    networks:
      - private_net
    restart: always

networks:
  private:
    internal: true

volumes:
  open-webui:
