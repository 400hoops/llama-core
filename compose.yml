services:
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    container_name: llamacpp
    ports:
      - "192.168.55.115:8081:8081"
    networks: [private_net]
    volumes:
      - /home/nux/llama/models:/models:ro,Z
      - /home/nux/llama/secrets/api-key:/run/api-key:ro,Z
    environment:
      - LD_LIBRARY_PATH=/app
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card1:/dev/dri/card1
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 24g
    pids_limit: 256
    restart: always
    command: >
      --models-dir /models/
      --models-max 1
      --models-preset /models/config.ini
      --port 8081
      --host 0.0.0.0
      --parallel 1
      --cache-ram 16384
      --cache-reuse 256
      -b 4096
      -ub 512
      -t 8
      -fa on
      --api-key-file /run/api-key
      --slot-save-path /models/kv-cache

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    ports:
      - "192.168.55.115:3000:8080"
    volumes:
      - /home/nux/data/open-webui:/app/backend/data:Z
    environment:
      - OPENAI_API_BASE_URL=http://llamacpp:8081/v1
      - OPENAI_API_KEY=${LLAMA_API_KEY}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - WEBUI_AUTH=true
      - ENABLE_SIGNUP=false
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      - llamacpp
    mem_limit: 4g
    pids_limit: 512
    restart: always

networks:
  private_net:
    internal: true
