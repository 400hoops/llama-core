# Conservative starting configuration for RX 7600 XT 16GB / llama.cpp Vulkan.
# Hardware stability and model fit have NOT been verified on the target machine.
# Model paths, aliases, sampling settings and GPU layer counts are preserved.
# Context limits are deliberately reduced; increase only after stable tests.
# Remove conflicting runtime flags from the router's Compose command:
# --parallel, --cache-ram, --cache-reuse, -b, -ub, -t and -fa.
# Current llama.cpp gives explicit router CLI arguments priority over presets.
# Keep --models-dir, --models-max, --models-preset, host/port and API-key-file.
# Remove --slot-save-path until it points to a separate writable volume.
# A 24GiB container limit is system RAM, not VRAM; model fit requires runtime logs.

version = 1

[*]
parallel = 1
threads = 8
batch-size = 2048
ubatch-size = 2048
ctx-size = 16384
flash-attn = on
# Quantized V cache requires Flash Attention. Do not disable FA alone.
cache-ram = 0
cache-reuse = 0
ctx-checkpoints = 0
load-mode = mmap
spec-type = none

[Gemi]
model = /models/gemma-4-26b/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
mmproj = /models/gemma-4-26b/mmproj-BF16.gguf
# Draft model intentionally omitted for the initial stability test.
temp = 0.75
top-p = 0.95
top-k = 64
min-p = 0.05
repeat-penalty = 1.0
cache-type-k = q4_0
cache-type-v = q4_0
n-gpu-layers = 27
no-mmproj-offload = true
image-min-tokens = 1024
image-max-tokens = 1024
threads = 8
ctx-size = 65536

[Gemi Mini]
model = /models/gemma-4-12b-qat/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
