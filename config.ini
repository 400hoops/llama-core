# llama.cpp model config
# Sampling params from vendor model cards. n-gpu-layers sized against
# 16GB RX 7600 XT (~15.2GB usable) using actual on-disk file sizes.
#
# KV cache stays q4_0 on anything over ~10GB of weights. That choice is
# what buys 128K context on this card - do not "upgrade" it without
# rechecking the arithmetic.

# ---------------------------------------------------------------------------
# Gemi / Gemma 4 26B A4B  (untouched)
# ---------------------------------------------------------------------------
[Gemi]
model = /models/gemma-4-26b/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
mmproj = /models/gemma-4-26b/mmproj-BF16.gguf
model-draft = /models/gemma-4-26b/mtp-gemma-4-26B-A4B-it.gguf
spec-type = draft-mtp
spec-draft-n-max = 2
temp = 0.75
top-p = 0.95
top-k = 64
min-p = 0.05
repeat-penalty = 1.0
ctx-size = 131072
cache-ram = 16384
flash-attn = on
cache-type-k = q4_0
cache-type-v = q4_0
n-gpu-layers = 27
load-mode = mmap+mlock
ctx-checkpoints = 32
checkpoint-min-step = 1024
# ---------------------------------------------------------------------------
# Gemi Mini / Gemma 4 12B QAT   6.3G + 168M mmproj + 242M draft = 6.7G
# Real headroom here, so the KV cache gets to stay high quality.
# ---------------------------------------------------------------------------
[Gemi Mini]
model = /models/gemma-4-12b-qat/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
mmproj = /models/gemma-4-12b-qat/mmproj-BF16.gguf
model-draft = /models/gemma-4-12b-qat/mtp-gemma-4-12B-it.gguf
spec-type = draft-mtp
spec-draft-n-max = 2
temp = 0.75
top-p = 0.95
top-k = 64
min-p = 0.05
repeat-penalty = 1.0
ctx-size = 131072
cache-ram = 8192
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
n-gpu-layers = 99

# ---------------------------------------------------------------------------
# GPT-OSS 20B   11G weights, 24 layers, MoE 3.6B active
# OpenAI: temp 1.0 / top-p 1.0 / top-k 0 / min-p 0.0
# top-k 100 instead of 0 - llama.cpp maintainers flag full-vocab sort as
# real CPU overhead. 100 filters almost nothing but skips the sort.
# jinja required: Harmony chat template.
# Reasoning effort goes in the system prompt: "Reasoning: high"
# ---------------------------------------------------------------------------
[GPT]
model = /models/gpt-oss/gpt-oss-20b-Q4_K_M.gguf
jinja = on
temp = 1.0
top-p = 1.0
top-k = 100
min-p = 0.0
repeat-penalty = 1.0
ctx-size = 131072
cache-ram = 16384
flash-attn = on
cache-type-k = q8_0
cache-type-v = q4_0
n-gpu-layers = 99

# ---------------------------------------------------------------------------
# Muse Glimmer 30B   14G weights + 2.0G mmproj, 52 layers, DENSE
# Meta: temp 1.0 / top-p 0.95 / top-k 64
# Reasoning strength in system prompt: "Reasoning strength: high"
#
# This model does not fit. Vendor floor is 18GB, you have 16.
# ctx dropped to 64K to claw back GPU layers. At 128K this drops to
# n-gpu-layers = 34, which puts 18 dense layers on DDR4.
# Faster alternative: delete the mmproj line, run text-only, ngl = 41
# at full 131072 context.
# ---------------------------------------------------------------------------
[Muse]
model = /models/muse-30b/Muse-Glimmer-30B-UD-IQ3_M.gguf
mmproj = /models/muse-30b/mmproj-Muse-Glimmer-30B-Q8_0.gguf
temp = 1.0
top-p = 0.95
top-k = 64
repeat-penalty = 1.0
ctx-size = 65536
cache-ram = 8192
flash-attn = on
cache-type-k = q4_0
cache-type-v = q4_0
n-gpu-layers = 40

# ---------------------------------------------------------------------------
# Qwen 3.6 27B   12G + 885M mmproj
# Qwen thinking mode, general tasks:
#   temp 1.0 / top-p 0.95 / top-k 20 / min-p 0.0 / presence-penalty 0.0
# Your old temp 0.6 was Qwen's *coding* preset. Switch back to 0.6 for code.
# n-gpu-layers stays at your 44 - that number is load-bearing.
# ---------------------------------------------------------------------------
[Qwen Max]
model = /models/qwen-3.8/Qwen3.8-27B-UD-IQ3_XXS.gguf
mmproj = /models/qwen-3.8/mmproj-F16.gguf
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0
ctx-size = 131072
cache-ram = 16384
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
n-gpu-layers = 64
load-mode = mmap+mlock
reasoning-preserve = false

# ---------------------------------------------------------------------------
# Qwen 3.6 35B-A3B   20G weights, MoE, 3B active per token
# Qwen thinking mode, general tasks:
#   temp 1.0 / top-p 0.95 / top-k 20 / min-p 0.0 / presence-penalty 1.5
# Note: the 35B MoE wants presence-penalty 1.5 where the 27B dense wants 0.0.
# Qwen documents that difference deliberately.
#
# 20G does not fit in 16G. n-gpu-layers stays at 99 anyway - the lever here
# is n-cpu-moe, which keeps attention on the GPU and pushes expert tensors
# to system RAM. Only 3B params fire per token, so CPU-side experts cost
# far less than dropping whole layers would.
# ---------------------------------------------------------------------------
[Qwen]
model = /models/qwen-3.6/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-Q4_K_M.gguf
mmproj = /models/qwen-3.6/mmproj-Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-f16.gguf
temp = 0.7
top-p = 0.80
top-k = 20
min-p = 0.0
presence-penalty = 1.5
repeat-penalty = 1.0
ctx-size = 131072
cache-ram = 8192
flash-attn = on
cache-type-k = q4_0
cache-type-v = q4_0
n-cpu-moe = 16
n-gpu-layers = 44

# ---------------------------------------------------------------------------
# Qwen 3.5 9B   5.3G
# Qwen thinking mode, general tasks:
#   temp 1.0 / top-p 0.95 / top-k 20 / min-p 0.0 / presence-penalty 1.5
# The 1.5 is not a typo. Qwen3.5 wants it, Qwen3.6-27B wants 0.0.
# ---------------------------------------------------------------------------
[Qwen Mini]
model = /models/qwen-3.5/Qwen3.5-9B-Uncensored-HauhauCS-Aggressive-Q4_K_M.gguf
mmproj = /models/qwen-3.5/mmproj-Qwen3.5-9B-Uncensored-HauhauCS-Aggressive-BF16.gguf
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 1.5
repeat-penalty = 1.0
ctx-size = 131072
cache-ram = 16384
flash-attn = on
cache-type-k = q8_0
cache-type-v = q5_1
n-gpu-layers = 99

# ---------------------------------------------------------------------------
# Bonsai 27B   3.6G + 889M mmproj
# PrismML: temp 0.7 / top-p 0.95 / top-k 20
# Weights are tiny, the KV cache is the whole cost here. Unquantized KV on
# this architecture at 128K is larger than the card. q8_0/q5_1 is the
# quality ceiling that actually fits.
# ---------------------------------------------------------------------------
[Bonsai]
model = /models/bonsai-27b/Bonsai-27B-Q1_0.gguf
mmproj = /models/bonsai-27b/Bonsai-27B-mmproj-BF16.gguf
temp = 0.7
top-p = 0.95
top-k = 20
repeat-penalty = 1.0
ctx-size = 262144
cache-ram = 16384
flash-attn = on
cache-type-k = q8_0
cache-type-v = q5_1
n-gpu-layers = 99

# ---------------------------------------------------------------------------
# North Mini Code 1.0   12G, 30B-A3B MoE
# Cohere: temp 1.0 / top-p 0.95. Works best with thinking enabled.
# Marginal at 99. If it OOMs, do NOT drop n-gpu-layers - add
# --n-cpu-moe N instead and keep attention on the GPU. Only 3B params
# activate per token, so CPU-side experts cost far less than you'd expect.
# ---------------------------------------------------------------------------
[North Mini]
model = /models/north-mini/North-Mini-Code-1.0-UD-IQ3_S.gguf
temp = 1.0
top-p = 0.95
repeat-penalty = 1.0
ctx-size = 131072
cache-ram = 16384
flash-attn = on
cache-type-k = q4_0
cache-type-v = q4_0
n-gpu-layers = 99
